name: Frontend CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --configuration production
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
      - name: Build frontend image
        run: docker build --tag netpay-frontend:ci .
      - name: Check static server configuration
        run: |
          docker run --rm -e API_HOST=203.0.113.10 -e ACME_EMAIL=ci@example.invalid \
            netpay-frontend:ci caddy adapt --config /etc/caddy/Caddyfile --validate

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    concurrency:
      group: netpay-frontend-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SSM_DEPLOY_DOCUMENT: ${{ vars.SSM_DEPLOY_DOCUMENT }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        env:
          DEPLOY_KEY: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          DEPLOY_SECRET: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set AWS_REGION}"
          : "${ECR_REPOSITORY_URL:?Set ECR_REPOSITORY_URL}"
          : "${EC2_INSTANCE_ID:?Set EC2_INSTANCE_ID}"
          : "${SSM_DEPLOY_DOCUMENT:?Set SSM_DEPLOY_DOCUMENT}"
          : "${FRONTEND_URL:?Set FRONTEND_URL}"
          : "${DEPLOY_KEY:?Set secret AWS_DEPLOY_ACCESS_KEY_ID}"
          : "${DEPLOY_SECRET:?Set secret AWS_DEPLOY_SECRET_ACCESS_KEY}"
          [[ "$FRONTEND_URL" == https://* ]]
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build and publish immutable release
        run: |
          set -euo pipefail
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY_URL#*/}" \
            --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Release already exists; reusing immutable image."
          else
            aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
            docker build --tag "$ECR_REPOSITORY_URL:$GITHUB_SHA" .
            docker push "$ECR_REPOSITORY_URL:$GITHUB_SHA"
          fi
      - name: Deploy through SSM
        run: |
          set -euo pipefail
          parameters=$(jq -n --arg release "$GITHUB_SHA" '{Release:[$release]}')
          command_id=$(aws ssm send-command --document-name "$SSM_DEPLOY_DOCUMENT" \
            --instance-ids "$EC2_INSTANCE_ID" --parameters "$parameters" --query Command.CommandId --output text)
          for attempt in {1..90}; do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Error:StandardErrorContent}' --output json
                exit 1 ;;
            esac
            sleep 10
          done
          echo 'SSM deployment timed out.' >&2
          exit 1
      - name: Verify public HTTPS entrypoint
        run: |
          page=$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "${FRONTEND_URL%/}/")
          [[ "$page" == *'<app-root'* ]]
