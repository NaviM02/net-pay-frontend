<div class="np-page">

  <app-list-page-header
    title="Página no encontrada"
    description="La dirección solicitada no existe o no está disponible"
  />

  <div class="np-not-found">
    <div class="np-not-found-icon">
      <app-material-icon [size]="34">explore_off</app-material-icon>
    </div>

    <p class="np-not-found-code">404</p>

    <p class="np-not-found-text">
      Verificá el enlace o volvé al inicio para seguir trabajando.
    </p>

    <a class="np-btn np-btn-sm np-btn-primary np-not-found-action" [routerLink]="homeRoute">
      <app-material-icon [size]="16">home</app-material-icon>
      Ir al inicio
    </a>
  </div>
</div>
