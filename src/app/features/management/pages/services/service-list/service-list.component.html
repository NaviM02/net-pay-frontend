<div class="np-page">

  <app-list-page-header
    title="Servicios"
    description="Planes y tarifas disponibles"
    saveText="Nuevo plan"
    (buttonClick)="add()"
  />

  <div class="np-list-card">
    <div class="np-table-actions-bar">
      <app-filter-menu
        [filterGroup]="listStateService.filter"
        (onFilterChange)="listStateService.onFilterChange($event)"
      />
      <app-data-import resource="services" (imported)="findAll()" />
    </div>

    <div class="np-table-scroll">
      <table class="table np-table mb-0">
        <thead>
        <tr>
          <th>PLAN</th>
          <th>VELOCIDAD</th>
          <th>PRECIO MENSUAL</th>
          <th>TIPO</th>
          <th>ESTADO</th>
          <th class="np-table-actions-cell text-end">ACCIONES</th>
        </tr>
        </thead>

        <tbody>
          @for (service of services; track service.hashId) {
            <tr>
              <td>
                <span class="np-table-primary">{{ service.name }}</span>
              </td>
              <td class="np-table-mono">{{ service.speed }}</td>
              <td class="np-table-mono">
                {{ service.monthlyPrice | currency: 'Q' : 'symbol' : '1.0-0' }}
              </td>
              <td><app-typology-badge [typology]="service.tpType" /></td>
              <td><app-typology-badge [typology]="service.tpStatus" /></td>
              <td class="np-table-actions-cell text-end">
                <app-table-row-action
                  [viewRoute]="['/services', service.hashId]"
                  (editAction)="edit(service.hashId)"
                  (deleteAction)="delete(service.hashId, service.name)" />
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="6">
                <div class="np-empty-state">No hay planes que coincidan con el filtro.</div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <app-pagination
      [pagination]="listStateService.pagination"
      (onPaginationChange)="listStateService.onPaginationChange($event)"
    />
  </div>
</div>

@if (showModal) {
  <app-service-form-modal
    [hashId]="selectedHashId"
    (close)="onModalClose($event)"
  />
}
