<div class="modal-header">
  <h2 class="modal-title fs-5">Cambiar contraseña</h2>
  <button type="button" class="btn-close" aria-label="Cerrar" (click)="activeModal.dismiss()"></button>
</div>

<form (ngSubmit)="save()">
  <div class="modal-body">
    <div class="mb-3">
      <label for="current-password" class="form-label required-field">Contraseña actual</label>
      <app-input-for-password
        [(ngModel)]="currentPassword"
        name="currentPassword"
        placeholder="Escribe la contraseña actual"
      />
    </div>
    <div class="mb-3">
      <label for="new-password" class="form-label required-field">Nueva contraseña</label>
      <app-input-for-password
        [(ngModel)]="newPassword"
        name="newPassword"
        placeholder="Mínimo 8 caracteres"
      />
      <div class="form-text">Debe tener al menos 8 caracteres.</div>
    </div>
    <div>
      <label for="confirm-password" class="form-label required-field">Confirmar nueva contraseña</label>
      <app-input-for-password
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        placeholder="Repite la nueva contraseña"
      />
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-light" [disabled]="saving" (click)="activeModal.dismiss()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="saving">
      {{ saving ? 'Guardando…' : 'Cambiar contraseña' }}
    </button>
  </div>
</form>
