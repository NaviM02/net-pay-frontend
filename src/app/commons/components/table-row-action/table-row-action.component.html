<div class="np-table-actions">
  @if (viewRoute) {
    <button
      type="button"
      class="np-action-button"
      title="Ver"
      [routerLink]="viewRoute"
    >
      <span class="material-symbols-outlined">visibility</span>
    </button>
  }

  @if (editAction.observed && showEdit) {
    <button
      type="button"
      class="np-action-button"
      title="Editar"
      (click)="editAction.emit()"
    >
      <span class="material-symbols-outlined">edit</span>
    </button>
  }

  @for (customAction of customActions; track customAction.label) {
    <button
      type="button"
      class="np-action-button"
      [class.np-action-danger]="customAction.danger"
      [title]="customAction.label"
      [attr.aria-label]="customAction.label"
      (click)="customAction.action()"
    >
      @if (customAction.icon) {
        <span class="material-symbols-outlined">{{ customAction.icon }}</span>
      } @else {
        {{ customAction.label }}
      }
    </button>
  }

  @if (deleteAction.observed && showDelete) {
    <button
      type="button"
      class="np-action-button np-action-danger"
      title="Eliminar"
      (click)="deleteAction.emit()"
    >
      <span class="material-symbols-outlined">delete</span>
    </button>
  }
</div>
