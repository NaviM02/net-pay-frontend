@if (!popup) {
  <!-- Inline mode -->
  <div>
    <ngb-datepicker
      (dateSelect)="onDateSelection($event)"
      [displayMonths]="1"
      [startDate]="fromModel ? { month: fromModel.month, year: fromModel.year } : { month: today.month, year: today.year }"
      [dayTemplate]="t"
      outsideDays="hidden"
    />

    <ng-template #t let-date let-focused="focused">
    <span
      class="custom-day"
      [class.focused]="focused"
      [class.range]="isRange(date)"
      [class.faded]="isHovered(date) || isInside(date)"
      (mouseenter)="hoveredDate = date"
      (mouseleave)="hoveredDate = null"
    >
      {{ date.day }}
    </span>
    </ng-template>
  </div>
} @else {
  <!-- Popup mode -->
  <form class="row row-cols-sm-auto g-2">
    <div class="col-auto position-relative">
      <div class="dp-hidden position-absolute">
        <input
          name="datepicker"
          class="form-control"
          ngbDatepicker
          #datepicker="ngbDatepicker"
          [autoClose]="'outside'"
          (dateSelect)="onDateSelection($event)"
          [displayMonths]="1"
          [dayTemplate]="t"
          outsideDays="hidden"
          [startDate]="fromModel!"
          tabindex="-1"
        />

        <ng-template #t let-date let-focused="focused">
          <span
            class="custom-day"
            [class.focused]="focused"
            [class.range]="isRange(date)"
            [class.faded]="isHovered(date) || isInside(date)"
            (mouseenter)="hoveredDate = date"
            (mouseleave)="hoveredDate = null"
          >
            {{ date.day }}
          </span>
        </ng-template>
      </div>

      <!-- From date -->
      <div
        class="input-group single-datepicker"
        [ngClass]="{ 'is-invalid': cFrom.touched && !allowEmpty && (!fromModel || cFrom.invalid) }"
      >
        <input
          class="form-control"
          placeholder="dd/mm/yyyy"
          name="dpFromDate"
          #cFrom='ngModel'
          [(ngModel)]="fromModel"
          ngbDatepicker
          [disabled]="disabled"
          (ngModelChange)="onModelChange($event, true)"
        />
        <button class="btn btn-outline-primary" type="button" (click)="datepicker.toggle()">
          <app-material-icon>calendar_month</app-material-icon>
        </button>
      </div>

    </div>

    <div class="col-auto">
      <!-- To date -->
      <div
        class="input-group single-datepicker"
        [ngClass]="{ 'is-invalid': cTo.touched && !allowEmpty && (!fromModel || cTo.invalid) }"
      >
        <input
          class="form-control"
          placeholder="dd/mm/yyyy"
          name="dpToDate"
          [(ngModel)]="toModel"
          #cTo='ngModel'
          ngbDatepicker
          [disabled]="disabled"
          (ngModelChange)="onModelChange($event, false)"
        />
        <button
          class="btn btn-outline-primary"
          type="button"
          (click)="datepicker.toggle()"
        >
          <app-material-icon>calendar_month</app-material-icon>
        </button>
      </div>

    </div>
  </form>
}
